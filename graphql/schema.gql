schema {
   query: Query
   mutation: Mutation
}





type uploader_Type {
    id: ID!
    name: String!
    surname: String!
    email: String!
    fileName: String!
}





type Query {
    all_uploaders: [uploader_Type]
    get_uploader(fileName: String!): uploader_Type
}

type Mutation {
    create_uploader(name: String!, surname: String!, email: String!, fileName: String!): uploader_Type
}